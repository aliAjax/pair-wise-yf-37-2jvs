<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>传染病暴发调查与接触网络</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #d1d5db; padding: .5rem .7rem; text-align: left; }
    th { background: #f3f4f6; }
    tr.overdue td { background: #fef2f2; color: #b91c1c; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
<main>
  <h1>传染病暴发调查与接触网络</h1>
  <h2>病例随访汇总</h2>
  <p><button onclick="loadSummary()">刷新汇总</button></p>
  <table id="summary">
    <thead>
      <tr><th>病例</th><th>病例状态</th><th>接触人数</th><th>逾期人数</th><th>最近观察截止日</th></tr>
    </thead>
    <tbody><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
  </table>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>
  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
GET  /api/case-summary</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

async function loadSummary() {
  const response = await fetch('/api/case-summary');
  const payload = await response.json();
  const tbody = document.querySelector('#summary tbody');
  tbody.innerHTML = '';
  if (!payload.items.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">暂无病例</td></tr>';
    return;
  }
  for (const item of payload.items) {
    const tr = document.createElement('tr');
    if (item.overdue_count > 0) tr.className = 'overdue';
    const cells = [
      item.person_id || item.case_id,
      item.status,
      item.contact_count,
      item.overdue_count,
      item.latest_due_at || '—',
    ];
    for (const value of cells) {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}
loadSummary();
</script>
</body>
</html>
